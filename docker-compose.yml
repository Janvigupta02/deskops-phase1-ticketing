version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: deskops-db
    environment:
      POSTGRES_DB: deskops
      POSTGRES_USER: deskops_user
      POSTGRES_PASSWORD: deskops_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskops_user -d deskops"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for future use: BullMQ, caching)
  redis:
    image: redis:7-alpine
    container_name: deskops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # DeskOps API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deskops-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://deskops_user:deskops_password@postgres:5432/deskops
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && node dist/server.js"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
